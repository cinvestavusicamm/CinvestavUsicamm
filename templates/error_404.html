<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - EscalafonIA</title>
    <style>
        :root {
            /* Usando el turquesa exacto de tus botones de EscalafonIA */
            --turquesa: #00B5B8; 
            --dark-blue: #1a2a3a;
            --gray-text: #666;
            --bg-light: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container-404 {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 550px;
            width: 90%;
        }

        .header-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .code {
            font-size: 100px;
            font-weight: 800;
            color: var(--turquesa);
            margin: 0;
            letter-spacing: -5px;
        }

        .title {
            font-size: 1.8rem;
            color: var(--dark-blue);
            margin: 0.5rem 0;
        }

        /* El recuadro del Jaguar IA con el estilo de tus recomendaciones */
        .jaguar-box {
            background-color: #f0fdfd;
            border: 1px solid #cdeff0;
            border-left: 5px solid var(--turquesa);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            text-align: left;
        }

        .jaguar-img {
            width: 70px;
            height: 70px;
            background-color: var(--turquesa);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            flex-shrink: 0;
        }

        .jaguar-content strong {
            color: var(--turquesa);
            display: block;
            margin-bottom: 0.3rem;
        }

        .jaguar-content p {
            font-size: 0.95rem;
            color: var(--gray-text);
            margin: 0;
            line-height: 1.4;
        }

        /* Botón con el estilo btn-main que usas en index_docente */
        .btn-escalafonia {
            display: inline-block;
            background-color: var(--turquesa);
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 181, 184, 0.3);
        }

        .btn-escalafonia:hover {
            background-color: #009ea1;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 181, 184, 0.4);
        }

        .footer-brand {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container-404">
        <div class="header-error">
            <h1 class="code">404</h1>
            <h2 class="title">Ruta no encontrada</h2>
        </div>

        <div class="jaguar-box">
            <div class="jaguar-img">🐆</div>
            <div class="jaguar-content">
                <strong>EscalafonIA te recomienda:</strong>
                <p>Parece que has intentado ingresar a una sección que no existe en el sistema. No te preocupes, como tu asistente Jaguar, te sugiero volver al panel principal para continuar con tu proceso.</p>
            </div>
        </div>

        <a href="/" class="btn-escalafonia">VOLVER AL PANEL</a>

        <div class="footer-brand">
            Cinvestav • USICAMM
        </div>
    </div>

</body>
</html>
