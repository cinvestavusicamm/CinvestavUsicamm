{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - SIU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
    
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        .background-carousel {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active { opacity: 1; }

        
#slide-1 { background-image: url('https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&q=80');}
#slide-2 { background-image: url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&q=80'); }
#slide-3 { background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80'); }
  
        header {
            background-color: #702032; 
            color: white;
            padding: 10px 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .logo img { height: 40px; border-radius: 50%; }

        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; }
        nav a { color: white; text-decoration: none; font-size: 14px; }

        /* Contenedor de Login */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
        }

        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo_jajuar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        h1 { color: #4a141d; font-size: 24px; margin-bottom: 20px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #702032; margin-bottom: 5px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f5f5f5;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #008080; /* Teal como en tu captura */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .auth-links { margin-top: 10px; font-size: 14px; }
        .auth-links a { color: #008080; text-decoration: none; font-weight: bold; }

        /* --- SECCIÓN DE LOGOS INFERIORES --- */
        .logos-footer-container {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .logo-footer-item img {
            max-height: 40px;
            width: auto;
        }

        .logo-footer-item span {
            display: block;
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="background-carousel">
        <div class="slide active" id="slide-1"></div>
        <div class="slide" id="slide-2"></div>
        <div class="slide" id="slide-3"></div>
    </div>

    <header>
        <div class="header-container">
            <div class="logo">
                <img src="https://img.freepik.com/premium-vector/simple-logo-lateral-view-maya-draw-jaguar-head-minimalist-mayan-aesthetic_746655-13160.jpg" alt="Logo">
                EscalafonIA
            </div>
            <nav>
                <ul>
                    <li><a href="{% url 'sesion' %}">Iniciar Sesión</a></li>
                    <li><a href="{% url 'registro' %}">Registrarse</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="logoI">
                <img class="logo_jajuar" src="https://img.freepik.com/premium-vector/simple-logo-lateral-view-maya-draw-jaguar-head-minimalist-mayan-aesthetic_746655-13160.jpg" alt="Jaguar">
            </div>
            <h1>Iniciar Sesión</h1>

            <form method="POST" action="{% url 'sesion' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Correo institucional</label>
                    <input type="email" name="correo" placeholder="Correo institucional" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                <button class="btn"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
            </form>

            <div class="auth-links">
                <p><a href="#">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
            </div>

            <div class="logos-footer-container">
                <div class="logo-footer-item">
                    <img src="{% static 'imagenes/logosimbolo.png' %}" alt="Cinvestav">
                    <span>Cinvestav</span>
                </div>
                <div class="logo-footer-item">
                    <img src="{% static 'imagenes/USICAMM.jpg' %}" alt="USICAMM">
                </div>
            </div>
        </div>
    </main>

    <footer>© 2025 EscalafonIA</footer>

    <script>
        let bgIndex = 0;
        const slides = document.querySelectorAll(".slide");
        setInterval(() => {
            slides[bgIndex].classList.remove("active");
            bgIndex = (bgIndex + 1) % slides.length;
            slides[bgIndex].classList.add("active");
        }, 8000);
    </script>
</body>
</html>
