{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Administrador | Sistema Escalafón</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor principal */
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header vino */
        .header {
            background: linear-gradient(135deg, #4a0e1b 0%, #6b1525 100%);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        /* Formulario */
        .form-content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a0e1b;
            font-weight: 500;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #6b1525;
            box-shadow: 0 0 0 3px rgba(107, 21, 37, 0.1);
        }

        input:hover {
            border-color: #6b1525;
        }

        /* Botón */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a0e1b 0%, #6b1525 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(107, 21, 37, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Mensajes de error */
        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        input.error {
            border-color: #e74c3c;
        }

        /* Pantalla de carga */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #6b1525;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-content {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Crear Administrador</h1>
        <p>Complete los datos para crear el administrador del sistema</p>
    </div>

    <div class="form-content">
        <form method="POST" id="adminForm">
            {% csrf_token %}

            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" name="nombre" placeholder="Ej: Juan" required>
            </div>

            <div class="form-group">
                <label>Apellido paterno <span class="required">*</span></label>
                <input type="text" name="apellido_paterno" placeholder="Ej: Pérez" required>
            </div>

            <div class="form-group">
                <label>Apellido materno</label>
                <input type="text" name="apellido_materno" placeholder="Ej: García">
            </div>

            <div class="form-group">
                <label>Correo electrónico <span class="required">*</span></label>
                <input type="email" name="correo" placeholder="ejemplo@dominio.com" required>
            </div>

            <div class="form-group">
                <label>CURP <span class="required">*</span></label>
                <input type="text" 
                       name="curp" 
                       id="curp"
                       placeholder="Ej: PEJC890101HDFRRN01" 
                       maxlength="18"
                       required>
                <div class="error-message" id="curpError">
                     CURP inválida. Debe tener 18 caracteres alfanuméricos en mayúsculas
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña <span class="required">*</span></label>
                <input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
        <label for="institucion">Institución:</label>
        <select name="institucion" id="institucion" required>
            <option value="">Seleccione una institución</option>
            {% for institucion in instituciones %}
                <option value="{{ institucion.id_institucion }}">
                    {{ institucion.nombre }} - {{ institucion.tipo }}
                </option>
            {% endfor %}
        </select>
    </div>  

            <button type="submit" class="btn-submit">Crear Administrador</button>
        </form>
    </div>
</div>

<!-- Pantalla de carga -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Creando administrador...</div>
    <div class="loading-text" style="font-size: 12px; margin-top: 10px;">Por favor espere</div>
</div>

<script>
    // Validación de CURP
    const curpInput = document.getElementById('curp');
    const curpError = document.getElementById('curpError');
    
    // Función para validar CURP (formato básico)
    function validarCURP(curp) {
        // Convertir a mayúsculas
        curp = curp.toUpperCase();
        
        // Expresión regular para CURP mexicana
        // Letras, números, formato: 4 letras + 6 números + 6 alfanuméricos
        const curpRegex = /^[A-Z]{4}[0-9]{6}[A-Z0-9]{6}$/;
        
        return curpRegex.test(curp);
    }
    
    // Formatear CURP a mayúsculas automáticamente
    curpInput.addEventListener('input', function(e) {
        let value = e.target.value.toUpperCase();
        e.target.value = value;
        
        // Validar mientras escribe
        if (value.length > 0) {
            if (!validarCURP(value) && value.length === 18) {
                curpError.classList.add('show');
                curpInput.classList.add('error');
            } else {
                curpError.classList.remove('show');
                curpInput.classList.remove('error');
            }
        } else {
            curpError.classList.remove('show');
            curpInput.classList.remove('error');
        }
    });
    
    // Validación al perder el foco
    curpInput.addEventListener('blur', function(e) {
        let value = e.target.value;
        if (value.length > 0 && !validarCURP(value)) {
            curpError.classList.add('show');
            curpInput.classList.add('error');
        }
    });
    
    // Validación del formulario antes de enviar
    const form = document.getElementById('adminForm');
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    form.addEventListener('submit', function(e) {
        // Validar CURP antes de enviar
        const curp = curpInput.value;
        
        if (!validarCURP(curp)) {
            e.preventDefault();
            curpError.classList.add('show');
            curpInput.classList.add('error');
            curpInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return false;
        }
        
        // Validar contraseña (mínimo 6 caracteres)
        const password = form.querySelector('input[name="password"]').value;
        if (password.length < 6) {
            e.preventDefault();
            alert('La contraseña debe tener al menos 6 caracteres');
            return false;
        }
        
        // Mostrar pantalla de carga
        loadingOverlay.classList.add('show');
        
        // El formulario se enviará automáticamente
        return true;
    });
    
    // Ocultar carga si hay error de red (opcional)
    window.addEventListener('pageshow', function() {
        loadingOverlay.classList.remove('show');
    });
</script>

</body>
</html>
