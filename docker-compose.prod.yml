services:
  # ─────────────────────────────────────────────────────────────────────
  # 1. NGINX - Reverse Proxy & Static File Server
  # ─────────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cinvestav_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      - django
      - ms_api_gateway
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 2. POSTGRESQL - Primary Database
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinvestav_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cinvestav_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init_scripts:/docker-entrypoint-initdb.d
    networks:
      - cinvestav_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-cinvestav_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 3. REDIS - Cache & Celery Broker
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cinvestav_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cinvestav_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes

  # ─────────────────────────────────────────────────────────────────────
  # 4. QDRANT - Vector Database for AI
  # ─────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cinvestav_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cinvestav_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 5. DJANGO CORE - Main Application (with load balancing)
  # ─────────────────────────────────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: apps/Dockerfile
    container_name: cinvestav_django
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cinvestav_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # 6. CELERY WORKER - Background Tasks
  # ─────────────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: apps/Dockerfile
    container_name: cinvestav_celery_worker
    command: celery -A core worker -l info --concurrency=4
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cinvestav_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────
  # 7. CELERY BEAT - Scheduled Tasks
  # ─────────────────────────────────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: apps/Dockerfile
    container_name: cinvestav_celery_beat
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cinvestav_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────
  # 8. API GATEWAY - Entry Point for APIs (with load balancing)
  # ─────────────────────────────────────────────────────────────────────
  ms_api_gateway:
    build:
      context: ./ms_api_gateway
      dockerfile: Dockerfile
    container_name: cinvestav_api_gateway
    ports:
      - "8100:8100"
    environment:
      - SERVICE_NAME=ms_api_gateway
      - LOG_LEVEL=INFO
      - AUTH_SERVICE_URL=http://ms_auth_service:8101
      - ACADEMIC_SERVICE_URL=http://ms_academic_service:8102
      - ASSESSMENT_SERVICE_URL=http://ms_assessment_service:8103
      - COURSE_SERVICE_URL=http://ms_course_service:8104
      - ADMIN_SERVICE_URL=http://ms_admin_service:8105
      - NOTIFICATION_SERVICE_URL=http://ms_notification_service:8106
      - AI_AGENT_SERVICE_URL=http://ms_ai_agent_service:8107
    depends_on:
      - ms_auth_service
      - ms_academic_service
      - ms_assessment_service
      - ms_course_service
      - ms_admin_service
      - ms_notification_service
      - ms_ai_agent_service
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 9. MICROSERVICES
  # ─────────────────────────────────────────────────────────────────────
  ms_auth_service:
    build:
      context: ./ms_auth_service
      dockerfile: Dockerfile
    container_name: cinvestav_auth_service
    ports:
      - "8101:8101"
    environment:
      - SERVICE_NAME=ms_auth_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_academic_service:
    build:
      context: ./ms_academic_service
      dockerfile: Dockerfile
    container_name: cinvestav_academic_service
    ports:
      - "8102:8102"
    environment:
      - SERVICE_NAME=ms_academic_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_assessment_service:
    build:
      context: ./ms_assessment_service
      dockerfile: Dockerfile
    container_name: cinvestav_assessment_service
    ports:
      - "8103:8103"
    environment:
      - SERVICE_NAME=ms_assessment_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_course_service:
    build:
      context: ./ms_course_service
      dockerfile: Dockerfile
    container_name: cinvestav_course_service
    ports:
      - "8104:8104"
    environment:
      - SERVICE_NAME=ms_course_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_admin_service:
    build:
      context: ./ms_admin_service
      dockerfile: Dockerfile
    container_name: cinvestav_admin_service
    ports:
      - "8105:8105"
    environment:
      - SERVICE_NAME=ms_admin_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_notification_service:
    build:
      context: ./ms_notification_service
      dockerfile: Dockerfile
    container_name: cinvestav_notification_service
    ports:
      - "8106:8106"
    environment:
      - SERVICE_NAME=ms_notification_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_ai_agent_service:
    build:
      context: ./ms_ai_agent_service
      dockerfile: Dockerfile
    container_name: cinvestav_ai_agent_service
    ports:
      - "8107:8107"
    environment:
      - SERVICE_NAME=ms_ai_agent_service
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_db:
    build:
      context: ./ms_db
      dockerfile: Dockerfile
    container_name: cinvestav_ms_db
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 10. EXISTING MICROSERVICES (ms_orchestrator, ms_reports, ms_validation)
  # ─────────────────────────────────────────────────────────────────────
  ms_orchestrator:
    build:
      context: ./ms_orchestrator
      dockerfile: Dockerfile
    container_name: cinvestav_orchestrator
    command: uvicorn src.infrastructure.api.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      - SERVICE_NAME=ms_orchestrator
      - LOG_LEVEL=INFO
      - ORCHESTRATOR_PORT=9000
      - VALIDATION_SERVICE_URL=http://ms_validation:8001
      - BACKEND_API_URL=http://backend_api:8003
      - MICROSERVICE_DB_URL=http://ms_db:8002
      - DJANGO_BACKEND_URL=http://django:8000
    depends_on:
      - ms_validation
      - ms_db
      - django
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_validation:
    build:
      context: .
      dockerfile: ms_validation/Dockerfile
    container_name: cinvestav_validation
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=ms_validation
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ms_reports:
    build:
      context: ./ms_reports
      dockerfile: Dockerfile
    container_name: cinvestav_reports
    command: uvicorn infrastructure.api.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=ms_reports
      - MS3_PORT=8004
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # 11. BACKEND API (IA Service Core)
  # ─────────────────────────────────────────────────────────────────────
  backend_api:
    build:
      context: ./backend_api
      dockerfile: Dockerfile
    container_name: cinvestav_backend_api
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-cinvestav_db}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinvestav_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ─────────────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────────────
networks:
  cinvestav_net:
    driver: bridge
    name: cinvestav_net

# ─────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local
