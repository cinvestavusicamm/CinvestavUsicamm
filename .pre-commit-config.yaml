# .pre-commit-config.yaml
# Ejecuta: pip install pre-commit && pre-commit install
repos:
  # 1. Hooks básicos de Git (Evita basura en el repositorio)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key # CRÍTICO: Evita subir llaves SSH o tokens a Git

  # 2. Formateador de Código (Black) - Acaba con las peleas de estilo
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3.11

  # 3. Linter ultra-rápido (Ruff) - Reemplaza a Flake8 e isort
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ] # Intenta arreglar errores automáticamente
      - id: ruff-format

  # 4. Seguridad Estática (Bandit) - Busca vulnerabilidades de inyección en Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]