services:
  # -------------------------------------------------------------------------
  # 1. BASE DE DATOS (PostgreSQL + pgvector)
  # -------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: escalafon_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: escalafon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_scripts:/docker-entrypoint-initdb.d
    networks:
      - escalafon_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d escalafon_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

    # -------------------------------------------------------------------------
  # 2. MOTOR DE INTELIGENCIA ARTIFICIAL (Ollama)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: motor_ollama
    volumes:
      - ollama_models:/root/.ollama  # Guardar los modelos descargados (Llama 3)
    ports:
      - "11434:11434"
    networks:
      - escalafon_net
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # Si tienes GPU NVIDIA, descomenta esto:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # -------------------------------------------------------------------------
  # 3. BACKEND API (Hexagonal - FastAPI)
  # -------------------------------------------------------------------------
  backend:
    container_name: ia_service_core
    build:
      context: ../backend_api
      dockerfile: Dockerfile
    command: uvicorn infrastructure.api.main:app --host 0.0.0.0 --port 8003 --reload --app-dir /app/src
    volumes:
      - ../backend_api:/app
    ports:
      - "8003:8003"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: escalafon_db
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://motor_ollama:11434
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy

    networks:
      - escalafon_net
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import requests; import sys; r=requests.get(\"http://127.0.0.1:8003/health\"); sys.exit(0 if r.status_code==200 else 1)'" ]
      interval: 5s
      retries: 5
      timeout: 5s

  # -------------------------------------------------------------------------
  # 4. DJANGO
  # -------------------------------------------------------------------------
  django:
    container_name: escalafon_django
    build:
      context: ..
      dockerfile: apps/Dockerfile
    volumes:
      - ../:/app
      - static_volume:/app/staticfiles
    env_file:
      - ../.env
    command: >
      sh -c "python manage.py collectstatic --noinput &&
            python manage.py migrate && echo '--------------Aplicacion corriendo en http://localhost:8001' &&
            gunicorn core.wsgi:application --bind 0.0.0.0:8000 --timeout 180 --worker-class gevent --workers 2"
    ports:
      - "8001:8000"
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - escalafon_net
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web

volumes:
  postgres_data:
  ollama_models:
  static_volume:

networks:
  escalafon_net:
    driver: bridge
