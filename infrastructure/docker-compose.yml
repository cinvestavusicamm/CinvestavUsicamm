version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. BASE DE DATOS (PostgreSQL + pgvector)
  # -------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16  # Imagen oficial con soporte vectorial
    container_name: escalafon_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: escalafon_db
    ports:
      - "5432:5432"
    volumes:
      # Persistencia de datos (para no perderlos al reiniciar)
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicio (creación de tablas y extensión vector)
      - ./database/init_scripts:/docker-entrypoint-initdb.d
    networks:
      - escalafon_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d escalafon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # 2. MOTOR DE INTELIGENCIA ARTIFICIAL (Ollama)
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: motor_ollama
    volumes:
      - ollama_models:/root/.ollama  # Guardar los modelos descargados (Llama 3)
    ports:
      - "11434:11434"
    networks:
      - escalafon_net
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # Si tienes GPU NVIDIA, descomenta esto:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # -------------------------------------------------------------------------
  # 3. BACKEND API (Hexagonal - FastAPI)
  # -------------------------------------------------------------------------
  backend:
    container_name: ia_service_core
    build:
      context: ../backend_api  # Sube un nivel para encontrar el código
      dockerfile: Dockerfile
    command: uvicorn infrastructure.api.main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ../backend_api:/app  # "Hot reload": cambios en código se reflejan al instante
    ports:
      - "8003:8003"
    environment:
      # Conexión a la BD (nombre del servicio 'db')
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: Escalafon_db
      POSTGRES_PORT: 5432
      # Conexión a Ollama (nombre del servicio 'ollama')
      OLLAMA_BASE_URL: http://ollama:11434
      PÝTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - escalafon_net

  django:
      container_name: escalafon_django
      build:
        context: ..                  # apunta a la raíz, donde está manage.py
        dockerfile: apps/Dockerfile  # tu Dockerfile de Django
      volumes:
        - ../:/app                    # para hot reload
      ports:
        - "8000:8000"
      depends_on:
        - backend
        - db
      networks:
        - escalafon_net


  # -------------------------------------------------------------------------
  # 4. FRONTEND WEB
  # -------------------------------------------------------------------------
  #frontend:
   # container_name: escalafonia_ui
    #build:
     # context: ../frontend_web
      #dockerfile: Dockerfile
    #volumes:
     # - ../frontend_web/src:/app/src  # Hot reload para desarrollo frontend
    #ports:
     # - "3000:80"  # Exponemos el puerto 80 del contenedor al 3000 de tu PC
    #depends_on:
     # - backend
    #networks:
     # - escalafon_net

# ---------------------------------------------------------------------------
# VOLUMENES Y REDES
# ---------------------------------------------------------------------------
networks:
  escalafon_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_models: