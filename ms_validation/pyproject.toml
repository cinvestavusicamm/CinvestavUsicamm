[project]
name = "ms_validation"
version = "0.1.0"
description = "Microservicio de validación de procesos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CinvestavUsicamm" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.9.0",
    "ia_common",
]

[build-system]
requires = ["hatchling>=1.13"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ms_validation"]
