version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ms_chat:
    build:
      context: .
      dockerfile: ia_service_core/Dockerfile
    command: /bin/sh -c "uv install --editable /app/ia_common || pip install -e /app/ia_common && uvicorn src.infrastructure.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src --reload-dir /app/ia_common"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/dev_db
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - db
      - qdrant
    volumes:
      - ./ia_service_core:/app
      - ./ia_common:/app/ia_common

  ms_validation:
    build:
      context: .
      dockerfile: ms_validation/Dockerfile
    command: /bin/sh -c "pip install -e /app/ia_common && uvicorn infrastructure.api.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/ms_validation/src --reload-dir /app/ia_common"
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: "/app/ms_validation/src:/app"
      OLLAMA_BASE_URL: "http://172.20.0.1:11434"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "ms_validation_rules"
      LLM_MODEL: "phi3:mini"
      EMBEDDING_MODEL: "nomic-embed-text"
    depends_on:
      - qdrant
    volumes:
      - ./ms_validation:/app/ms_validation
      - ./ia_common:/app/ia_common

  frontend_web:
    build:
      context: ./frontend_web
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_web:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  # =========================================================
  # MS_REPORTS: MOTOR DE REPORTES EFÍMEROS Y WORKERS ASÍNCRONOS
  # =========================================================
  redis_reports:
    image: redis:7-alpine
    container_name: redis_reports
    ports:
      - "6380:6379"

  ms_reports_api:
    build:
      context: ./ms_reports
      dockerfile: Dockerfile
    container_name: ms_reports_api
    # Sobrescribimos el CMD para activar la recarga en caliente (hot-reload)
    command: /bin/sh -c "uvicorn infrastructure.api.main:app --host 0.0.0.0 --port 8003 --reload --reload-dir /srv/ms3_reports/src"
    ports:
      - "8003:8003"
    environment:
      PYTHONPATH: "/srv/ms3_reports/src:/srv/ms3_reports"
      MS3_REDIS_URL: "redis://redis_reports:6379"
      DATABASE_URL: "postgresql://dev:dev@db:5432/dev_db"
      TZ: "America/Mexico_City"
    depends_on:
      - db
      - redis_reports
      - qdrant
    volumes:
      - ./ms_reports:/srv/ms3_reports

  ms_reports_worker:
    build:
      context: ./ms_reports
      dockerfile: Dockerfile
    container_name: ms_reports_worker
    command: celery -A infrastructure.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      PYTHONPATH: "/srv/ms3_reports/src:/srv/ms3_reports"
      MS3_REDIS_URL: "redis://redis_reports:6379"
      DATABASE_URL: "postgresql://dev:dev@db:5432/dev_db"
      TZ: "America/Mexico_City"
    depends_on:
      - db
      - redis_reports
    volumes:
      - ./ms_reports:/srv/ms3_reports

volumes:
  db_data:
  qdrant_storage: