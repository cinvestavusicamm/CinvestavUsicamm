# pyproject.toml (Raíz)
[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (ordenamiento de imports)
    "C90",# mccabe (complejidad ciclomática)
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
tests = ["B201", "B301"] # Puedes ajustar las reglas de seguridad
skips = ["B101"] # Ignorar asserts en código 